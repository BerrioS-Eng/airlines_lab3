apiVersion: apps/v1
kind: Deployment
metadata:
  name: airlineskbt-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: airlineskbt
  template:
    metadata:
      labels:
        app: airlineskbt
    spec:
      containers:
        - name: airlineskbt-app
          image: airlineskbt-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/kbt"
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: mysql-config
                  key: MYSQL_ROOT_PASSWORD

---
apiVersion: v1
kind: Service
metadata:
  name: airlineskbt-service
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: airlineskbt
  type: LoadBalancer